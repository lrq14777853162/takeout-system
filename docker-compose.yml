version: '3.8'

services:
  # 后端 API 服务
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fooddelivery-api
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Server=mysql;Port=3306;Database=food_delivery;User Id=root;Password=FoodDelivery123!;
      - Redis__Configuration=redis:6379
      - RabbitMQ__Host=rabbitmq
      - AuthServer__Authority=http://localhost:5000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fooddelivery-network

  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: fooddelivery-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: FoodDelivery123!
      MYSQL_DATABASE: food_delivery
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pFoodDelivery123!"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fooddelivery-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: fooddelivery-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fooddelivery-network

  # RabbitMQ 消息队列
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fooddelivery-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: FoodDelivery123!
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - fooddelivery-network

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:

networks:
  fooddelivery-network:
    driver: bridge
